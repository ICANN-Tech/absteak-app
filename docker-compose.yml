networks:
  absteak:
    driver: bridge
    name: absteak_network

services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "5173:5173"
      - "5174:5174"
      - "5175:5175"
    volumes:
      - .:/app
      - vendor_data:/app/vendor
      - node_modules_data:/app/node_modules
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    environment:
      APP_NAME: "ABSteak App"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: app_db
      DB_USERNAME: absteak_user
      DB_PASSWORD: absteak_secure_password_2024
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FLOWISE_BASE_URL: "http://flowise:3000"
      FLOWISE_TIMEOUT: 30
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@absteak.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ABSteak App}
      EMAIL_ENVIRONMENT: ${EMAIL_ENVIRONMENT:-development}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: absteak_db
      MONGO_USERNAME: absteak_app
      MONGO_PASSWORD: absteak_app_password_2024
      FILESYSTEM_DISK: local
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: media
      AWS_ENDPOINT: http://minio:9000
      XENDIT_API_KEY: ${XENDIT_API_KEY:-xnd_development_your_key_here}
      XENDIT_PUBLIC_KEY: ${XENDIT_PUBLIC_KEY:-xnd_public_development_your_public_key_here}
      XENDIT_CALLBACK_TOKEN: ${XENDIT_CALLBACK_TOKEN:-your_callback_token_here}
      XENDIT_IS_PRODUCTION: ${XENDIT_IS_PRODUCTION:-false}
      XENDIT_WEBHOOK_URL: ${XENDIT_WEBHOOK_URL:-http://localhost:8000/webhook/xendit}
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434
      OLLAMA_BASE_URL: "http://ollama:11434"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 2g
    memswap_limit: 2g
    networks:
      - absteak
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: postgres
    user: "999:999"
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: absteak_user
      POSTGRES_PASSWORD: absteak_secure_password_2024
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absteak_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - absteak
    restart: unless-stopped
    command: [
      "postgres",
      "-c", "shared_preload_libraries=vector",
      "-c", "max_connections=200",
      "-c", "shared_buffers=256MB",
      "-c", "effective_cache_size=1GB",
      "-c", "work_mem=4MB",
      "-c", "maintenance_work_mem=64MB",
      "-c", "random_page_cost=1.1",
      "-c", "temp_file_limit=2GB",
      "-c", "log_min_duration_statement=1000",
      "-c", "log_connections=on",
      "-c", "log_disconnections=on",
      "-c", "log_lock_waits=on",
      "-c", "log_statement=mod",
      "-c", "log_temp_files=0",
      "-c", "track_counts=on",
      "-c", "track_io_timing=on",
      "-c", "track_functions=pl",
      "-c", "checkpoint_completion_target=0.9"
    ]

  flowise:
    image: flowiseai/flowise:3.0.5
    container_name: flowise
    env_file:
      - ./docker/flowise/flowise.env
    ports:
      - "3000:3000"
    volumes:
      - flowise_data:/root/.flowise
    mem_limit: 1g
    memswap_limit: 1g
    networks:
      - absteak
    restart: unless-stopped
    depends_on:
      - weaviate

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - absteak
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    env_file:
      - ./docker/mongodb/mongo.env
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - absteak
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost:27017", "--username", "admin", "--password", "admin_password_2024", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
  
  weaviate:
    image: semitechnologies/weaviate:1.30.0
    container_name: weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'
      AUTHENTICATION_APIKEY_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: 'jqyUWkzrrfl0040t2Hyo3nVAa4xLj6viTDSeEd6wgKPt6cwLk7n99AZhjDv9CkKs'
      AUTHENTICATION_APIKEY_USERS: 'admin'
      QUERY_DEFAULTS_LIMIT: 25
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: 'text2vec-cohere,text2vec-huggingface,text2vec-palm,text2vec-openai,generative-openai,generative-cohere,generative-palm,ref2vec-centroid,reranker-cohere,qna-openai'
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - absteak
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  beanstalkd:
    image: maateen/docker-beanstalkd:1.8-alpine-3.12
    platform: linux/amd64 
    container_name: beanstalkd
    ports:
      - "11300:11300"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    networks:
      - absteak
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    depends_on:
      - node-exporter
      - cadvisor

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - absteak
    restart: unless-stopped
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - absteak
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - absteak
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.20
    container_name: vault
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: server -dev
    volumes:
      - ./vault-data:/vault/file

  n8n:
    image: n8nio/n8n:latest
    container_name: absteak_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin_password_2024
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - DB_TYPE=sqlite
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - absteak
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: absteak_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio_data:/data
    networks:
      - absteak
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  dovecot:
    image: dovecot/dovecot:2.4.1
    container_name: absteak_dovecot
    ports:
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
    environment:
      DOVECOT_HOSTNAME: mail.absteak.local
      DOVECOT_DOMAIN: absteak.local
    volumes:
      - dovecot_data:/var/mail
      - dovecot_config:/etc/dovecot
    networks:
      - absteak
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "doveadm", "who"]
      interval: 30s
      timeout: 10s
      retries: 3

  rocketchat:
    image: rocketchat/rocket.chat:latest
    platform: linux/amd64 
    container_name: rocketchat
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - 3003:3000
    environment:
      MONGO_URL: mongodb://admin:admin_password_2024@mongodb:27017/rocketchat?authSource=admin
      ROOT_URL: http://localhost:3003
      PORT: 3000
    networks:
      - absteak
    restart: unless-stopped

  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: absteak_soketi
    ports:
      - "6001:6001"
      - "9601:9601"
    environment:
      SOKETI_DEBUG: "1"
      SOKETI_METRICS_SERVER_PORT: "9601"
      SOKETI_DEFAULT_APP_ID: "app-id"
      SOKETI_DEFAULT_APP_KEY: "app-key"
      SOKETI_DEFAULT_APP_SECRET: "app-secret"
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "true"
      SOKETI_DEFAULT_APP_ENABLED: "true"
      SOKETI_DEFAULT_APP_MAX_CONNECTIONS: "100"
      SOKETI_DEFAULT_APP_MAX_BACKEND_EVENTS_PER_MINUTE: "10000"
      SOKETI_DEFAULT_APP_MAX_CLIENT_EVENTS_PER_MINUTE: "10000"
      SOKETI_DEFAULT_APP_MAX_READ_REQUESTS_PER_MINUTE: "10000"
    networks:
      - absteak
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9601/"]
      interval: 30s
      timeout: 10s
      retries: 3

  listmonk_db:
    image: postgres:16-alpine
    container_name: listmonk_postgres
    environment:
      POSTGRES_DB: listmonk_db
      POSTGRES_USER: listmonk_user
      POSTGRES_PASSWORD: listmonk_secure_password_2024
    volumes:
      - listmonk_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk_user -d listmonk_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - absteak
    restart: unless-stopped

  listmonk:
    image: listmonk/listmonk:latest
    container_name: absteak_listmonk
    ports:
      - "9010:9000"
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_db__host: listmonk_db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk_user
      LISTMONK_db__password: listmonk_secure_password_2024
      LISTMONK_db__database: listmonk_db
      LISTMONK_db__ssl_mode: disable
      LISTMONK_db__max_open: 25
      LISTMONK_db__max_idle: 25
      LISTMONK_db__max_lifetime: 300s
      TZ: UTC
      LISTMONK_ADMIN_USER: admin
      LISTMONK_ADMIN_PASSWORD: absteak_admin_2024
    volumes:
      - listmonk_data:/listmonk
      - listmonk_uploads:/listmonk/uploads
    depends_on:
      listmonk_db:
        condition: service_healthy
    networks:
      - absteak
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: [sh, -c, "./listmonk --install --idempotent --yes && ./listmonk --upgrade --yes && ./listmonk"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: absteak_ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - absteak
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ollama-init:
    image: ollama/ollama:latest
    container_name: absteak_ollama_init
    volumes:
      - ./docker/ollama/init-ollama.sh:/init-ollama.sh:ro
      - ollama_data:/root/.ollama
    networks:
      - absteak
    depends_on:
      ollama:
        condition: service_healthy
    command: ["/bin/bash", "/init-ollama.sh"]
    restart: "no"
    environment:
      - OLLAMA_HOST=ollama:11434

volumes:
  db_data:
  redis_data:
  mongodb_data:
  mongodb_config:
  flowise_data:
  prometheus_data:
  grafana_data:
  n8n_data:
  minio_data:
  dovecot_data:
  dovecot_config:
  mattermost_data:
  mattermost_logs:
  mattermost_config:
  vendor_data:
  node_modules_data:
  weaviate_data:
  ollama_data:
    driver: local
  listmonk_data:
    driver: local
  listmonk_uploads:
    driver: local
  listmonk_db_data:
    driver: local
