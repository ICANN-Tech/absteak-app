networks:
  absteak:
    driver: bridge
    name: absteak_network

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "5173:5173"
      - "5174:5174"
      - "5175:5175"
    volumes:
      - .:/app
      - vendor_data:/app/vendor
      - node_modules_data:/app/node_modules
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    environment:
      APP_NAME: "ABSteak App"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: app_db
      DB_USERNAME: absteak_user
      DB_PASSWORD: absteak_secure_password_2024
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FLOWISE_BASE_URL: "http://flowise:3000"
      FLOWISE_TIMEOUT: 30

      # Mongo connection
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: absteak_db
      MONGO_USERNAME: absteak_app
      MONGO_PASSWORD: absteak_app_password_2024
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - absteak
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: absteak_user
      POSTGRES_PASSWORD: absteak_secure_password_2024
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absteak_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - absteak
    restart: unless-stopped

  flowise:
    image: flowiseai/flowise:3.0.5
    container_name: absteak_flowise
    environment:
      PORT: 3000
      FLOWISE_USERNAME: flowise
      FLOWISE_PASSWORD: FfZt9zjqJNq22Ccbdn

      # File and storage configuration
      FLOWISE_FILE_SIZE_LIMIT: 100mb
      FLOWISE_FILE_TYPES: pdf,docx,xlsx,csv,zip,tar.gz

      # Weaviate configuration
      FLOWISE_WEAVIATE_URL: http://weaviate:8080
      FLOWISE_WEAVIATE_API_KEY: "jqyUWkzrrfl0040t2Hyo3nVAa4xLj6viTDSeEd6wgKPt6cwLk7n99AZhjDv9CkKs"
      FLOWISE_WEAVIATE_INDEX: knowledge
    ports:
      - "3000:3000"
    volumes:
      - flowise_data:/root/.flowise
    mem_limit: 1g
    memswap_limit: 1g
    networks:
      - absteak
    restart: unless-stopped
    depends_on:
      - weaviate
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - absteak
    restart: unless-stopped

  redis_gui:
    image: redislabs/redisinsight:2.70
    container_name: redis_gui
    ports:
      - "8001:5540"
    environment:
      - RIPORT=5540
      - RIHOST=0.0.0.0
    volumes:
      - redis_gui_data:/data
    networks:
      - absteak
    restart: unless-stopped
    depends_on:
      - redis

  mongodb:
    image: mongo:7.0
    container_name: absteak_mongodb
    ports:
      - "27017:27017"
    environment:
      # Root user credentials
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password_2024
      MONGO_INITDB_DATABASE: absteak_db
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./docker/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - absteak
    restart: unless-stopped
    command: [
      "mongod",
      "--auth",
      "--bind_ip_all"
    ]
    healthcheck:
      test: [
        "CMD",
        "mongosh",
        "--host", "localhost:27017",
        "--username", "admin",
        "--password", "admin_password_2024",
        "--authenticationDatabase", "admin",
        "--eval", "db.adminCommand('ping').ok"
      ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 1g
    memswap_limit: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  weaviate:
    image: semitechnologies/weaviate:1.30.0
    container_name: weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'
      AUTHENTICATION_APIKEY_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: 'jqyUWkzrrfl0040t2Hyo3nVAa4xLj6viTDSeEd6wgKPt6cwLk7n99AZhjDv9CkKs'
      AUTHENTICATION_APIKEY_USERS: 'admin'
      QUERY_DEFAULTS_LIMIT: 25
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: 'text2vec-cohere,text2vec-huggingface,text2vec-palm,text2vec-openai,generative-openai,generative-cohere,generative-palm,ref2vec-centroid,reranker-cohere,qna-openai'
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - absteak
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  beanstalkd:
    image: maateen/docker-beanstalkd:1.8-alpine-3.12
    container_name: beanstalkd
    ports:
      - "11300:11300"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - absteak
    restart: unless-stopped
    command:
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - absteak
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.7
    container_name: absteak_ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 6g
    memswap_limit: 12g
    cpus: 4
    networks:
      - absteak
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  vault:
    image: hashicorp/vault:1.20
    container_name: vault
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: server -dev
    volumes:
      - ./vault-data:/vault/file

  n8n:
    image: n8nio/n8n:latest
    container_name: absteak_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin_password_2024
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - DB_TYPE=sqlite
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - absteak
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  cloudbeaver:
    image: dbeaver/cloudbeaver:25
    container_name: absteak_cloudbeaver
    ports:
      - "8978:8978"
    environment:
      - CB_SERVER_NAME=ABSteak CloudBeaver
      - CB_ADMIN_NAME=cbadmin
      - CB_ADMIN_PASSWORD=Admin|cb1
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - absteak
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8978/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  db_data:
  redis_data:
  redis_gui_data:
  chroma_data:
  flowise_data:
  grafana_data:
  mongodb_data:
  mongodb_config:
  weaviate_data:
  prometheus_data:
  vendor_data:
  node_modules_data:
  ollama_data:
  n8n_data:
  cloudbeaver_data:
